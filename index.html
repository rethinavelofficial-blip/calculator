<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #121212;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .calculator {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 16px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #display {
        width: 100%;
        height: 70px;
        font-size: 28px;
        text-align: right;
        padding: 10px;
        margin-bottom: 15px;
        border: none;
        border-radius: 10px;
        background: #000;
        color: #ffffff; /* WHITE numbers */
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        height: 60px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: #2d2d2d;
        color: #fff;
    }

    button.operator {
        background: #ff9800;
        color: #000;
    }

    button.equal {
        background: #00e676;
        color: #000;
        grid-column: span 2;
    }

    button.clear {
        background: #e53935;
    }

    button.back {
        background: #607d8b;
    }

    button:active {
        transform: scale(0.96);
    }

    @media (max-width: 400px) {
        button {
            height: 55px;
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <div class="buttons" id="buttons"></div>
</div>

<script>
/* Object: Calculator State */
const calc = {
    current: "",
    previous: null,
    operator: ""
};

/* Array: Buttons */
const buttons = [
    "C", "⌫", "%", "/",
    "7", "8", "9", "*",
    "4", "5", "6", "-",
    "1", "2", "3", "+",
    "0", ".", "="
];

/* DOM */
const display = document.getElementById("display");
const container = document.getElementById("buttons");

/* Loop: Create buttons */
buttons.forEach(value => {
    const btn = document.createElement("button");
    btn.textContent = value;

    if ("+-*/%".includes(value)) btn.classList.add("operator");
    if (value === "=") btn.classList.add("equal");
    if (value === "C") btn.classList.add("clear");
    if (value === "⌫") btn.classList.add("back");

    btn.onclick = () => handleInput(value);
    container.appendChild(btn);
});

/* Function: Handle input */
function handleInput(value) {

    if (value === "C") return clearAll();
    if (value === "⌫") return backspace();
    if (value === "=") return calculate();

    if ("+-*/%".includes(value)) {
        if (calc.current === "") return;
        calc.previous = parseFloat(calc.current);
        calc.operator = value;
        calc.current = "";
        return;
    }

    if (value === "." && calc.current.includes(".")) return;

    calc.current += value;
    display.value = calc.current;
}

/* Function: Calculate */
function calculate() {
    if (calc.previous === null || calc.current === "") return;

    const curr = parseFloat(calc.current);
    let result;

    switch (calc.operator) {
        case "+": result = calc.previous + curr; break;
        case "-": result = calc.previous - curr; break;
        case "*": result = calc.previous * curr; break;
        case "/":
            if (curr === 0) {
                display.value = "Error";
                return clearAll();
            }
            result = calc.previous / curr;
            break;
        case "%": result = calc.previous % curr; break;
    }

    display.value = result;
    calc.current = result.toString();
    calc.previous = null;
    calc.operator = "";
}

/* Utility Functions */
function clearAll() {
    calc.current = "";
    calc.previous = null;
    calc.operator = "";
    display.value = "";
}

function backspace() {
    calc.current = calc.current.slice(0, -1);
    display.value = calc.current;
}

/* Keyboard Support */
document.addEventListener("keydown", e => {
    if (!isNaN(e.key) || "+-*/.%".includes(e.key)) handleInput(e.key);
    if (e.key === "Enter") handleInput("=");
    if (e.key === "Backspace") handleInput("⌫");
    if (e.key === "Escape") handleInput("C");
});
</script>

</body>
</html>
